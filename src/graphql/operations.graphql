# GraphQL operations used by this template.
#
# These documents are consumed by GraphQL Codegen (`pnpm graphql:generate`),
# which emits typed helpers into `src/gql/` (git-ignored). Add your own
# operations here (or in any src/**/*.graphql) and regenerate.
#
# Schema reference: https://quiltt.dev/api/graphql

query ProfileQuery {
  profile {
    id
    email
  }
}

query AccountsQuery {
  accounts {
    id
    name
    balance {
      current
    }
  }
}
